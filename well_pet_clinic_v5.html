<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Well Pet Clinic & Grooming — นัดหมาย</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f3df;color:#25304a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}
header{background:#f4cf45;border-bottom:4px solid #e4b82f;padding:18px}
.wrap{max-width:1050px;margin:auto}
.brand{display:flex;align-items:center;gap:12px;color:#1d4f91;font-weight:900;font-size:24px}
.cat{width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid #1d4f91;display:grid;place-items:center;font-size:27px}
.sub{margin-left:60px;color:#1d4f91;font-weight:700}
.main{padding:20px 16px}
.paper{background:#fffdf5;border:2px solid #3e4a55;border-radius:4px;box-shadow:0 5px 14px #6b5b2520;max-width:1050px;margin:auto;padding:20px}
.paper-head{text-align:center;border-bottom:2px solid #394654;padding-bottom:12px;margin-bottom:16px}
.paper-head h1{margin:0;color:#1d4f91;font-size:25px}
.paper-head p{margin:5px 0 0;font-weight:700}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.field{display:flex;align-items:center;gap:8px}
.field label{font-weight:800;white-space:nowrap}
input,select{font:inherit;background:#fff;border:0;border-bottom:2px solid #59636e;border-radius:0;padding:7px 4px;outline:none;min-width:0;flex:1}
.section{margin-top:20px;border-top:2px solid #56616d;padding-top:12px}
.section h2{font-size:18px;color:#1d4f91;margin:0 0 10px}
.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px 24px}
.check{display:flex;align-items:center;gap:8px;font-weight:650}
.check input{width:18px;height:18px;flex:none;accent-color:#e1b51d}
.other{border-bottom:2px solid #59636e;min-width:100px;flex:1}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
button{font:inherit;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:800}
.primary{background:#1d4f91;color:white}.secondary{background:#eee5c3;color:#33425a}
.dashboard{margin-top:24px}
.dashboard h2{color:#1d4f91;margin:0 0 10px}
.tablebox{overflow:auto;background:#fff;border:1px solid #ddd2a9}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 12px;border-bottom:1px solid #e5dfc8;text-align:left}
th{background:#f4e8a8;color:#1d4f91}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff0a8;font-weight:800;font-size:12px}
.modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}.box{background:#fffdf5;border:2px solid #c7a52b;border-radius:12px;padding:20px;max-width:430px;width:100%}
.box h2{color:#1d4f91;margin-top:0}
.modal .field{margin:10px 0}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:700px){
 .form-grid,.checkgrid{grid-template-columns:1fr}.brand{font-size:19px}.sub{margin-left:60px;font-size:13px}
 .paper{padding:14px}.field{align-items:flex-end}
}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand"><div class="cat">🐱</div><div>Well Pet Clinic & Grooming</div></div>
    <div class="sub">ระบบนัดหมายสัตว์เลี้ยง</div>
  </div>
</header>

<main class="main">
<div class="paper">
  <div class="paper-head">
    <h1>🐾 ใบนัด 🐾</h1>
    <p>Well Pet Clinic & Grooming</p>
  </div>

  <div class="form-grid">
    <div class="field"><label>ชื่อสัตว์</label><input id="pet" placeholder="________________"></div>
    <div class="field"><label>เลขประวัติ</label><input id="record" placeholder="________________"></div>
    <div class="field"><label>วันที่นัด</label><input id="date" type="date"></div>
    <div class="field"><label>เวลา</label><input id="time" type="time"></div>
    <div class="field"><label>ชื่อเจ้าของ</label><input id="owner" placeholder="________________"></div>
    <div class="field"><label>โทร.</label><input id="phone" placeholder="________________"></div>
  </div>

  <div class="section">
    <h2>🩺 รายการนัด</h2>
    <div class="checkgrid">
      <label class="check"><input type="checkbox" value="ตรวจแผล"> ตรวจแผล</label>
      <label class="check"><input type="checkbox" value="ตัดไหม"> ตัดไหม</label>
      <label class="check"><input type="checkbox" value="ตรวจเลือด"> ตรวจเลือด</label>
      <label class="check"><input type="checkbox" value="ตรวจผิวหนัง"> ตรวจผิวหนัง</label>
      <label class="check"><input type="checkbox" value="พ่นยา"> พ่นยา</label>
      <label class="check"><input type="checkbox" value="ทำแผล"> ทำแผล</label>
      <label class="check"><input type="checkbox" value="ถ่ายพยาธิ"> ถ่ายพยาธิ</label>
      <label class="check"><input type="checkbox" value="หมอนัด"> หมอนัด / ติดตามอาการ</label>
    </div>
  </div>

  <div class="section">
    <h2>💉 วัคซีน</h2>
    <div class="checkgrid">
      <label class="check"><input type="checkbox" value="วัคซีนรวมลูกสุนัข"> วัคซีนรวมลูกสุนัข</label>
      <label class="check"><input type="checkbox" value="วัคซีนพิษสุนัขบ้า"> วัคซีนพิษสุนัขบ้า</label>
      <label class="check"><input type="checkbox" value="วัคซีนรวม 5 โรค"> วัคซีนรวม 5 โรค</label>
      <label class="check"><input type="checkbox" value="วัคซีนรวมแมว"> วัคซีนรวมแมว</label>
      <label class="check"><input type="checkbox" value="วัคซีนรวม 6 โรค"> วัคซีนรวม 6 โรค</label>
      <label class="check"><input type="checkbox" value="วัคซีนป้องกันโรคลิวคีเมีย"> วัคซีนป้องกันโรคลิวคีเมีย</label>
      <label class="check"><input type="checkbox" value="วัคซีนป้องกันหวัดและหลอดลมอักเสบ"> ป้องกันหวัดและหลอดลมอักเสบ</label>
      <label class="check"><input type="checkbox" value="อื่นๆ"> อื่นๆ <input class="other" id="otherText" type="text" placeholder="ระบุรายการ"></label>
    </div>
  </div>

  <div class="actions">
    <button class="secondary" onclick="exportData()">⬇️ สำรองข้อมูล</button>
    <button class="secondary" onclick="clearForm()">ล้างข้อมูล</button>
    <button class="primary" onclick="saveAppointment()">💾 บันทึกใบนัด</button>
  </div>
</div>

<div class="paper dashboard">
  <h2>📋 รายการนัดหมาย</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
    <input id="searchBox" type="search" placeholder="🔎 ค้นหาชื่อสัตว์ / เลขประวัติ / เจ้าของ / เบอร์โทร" style="border:1px solid #cfc6a5;border-radius:8px;padding:10px;flex:1;min-width:220px">
  </div>
  <div class="tablebox">
    <table>
      <thead><tr><th>วันที่</th><th>เวลา</th><th>สัตว์เลี้ยง</th><th>เจ้าของ</th><th>รายการ</th><th>จัดการ</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>
</main>

<div class="modal" id="detailModal">
 <div class="box">
  <h2>📋 รายละเอียดนัดหมาย</h2>
  <div id="detailContent"></div>
  <div class="modal-actions">
    <button class="secondary" onclick="closeDetail()">ปิด</button>
    <button class="primary" onclick="editCurrent()">✏️ แก้ไข</button>
  </div>
 </div>
</div>

<div class="modal" id="modal">
 <div class="box">
  <h2>ลบนัดหมาย</h2>
  <p>ต้องการลบนัดหมายนี้ใช่ไหม?</p>
  <div class="modal-actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="primary" onclick="confirmDelete()">ลบ</button></div>
 </div>
</div>

<script>
let appointments=[];
let deleteId=null;
let detailId=null;
const $=id=>document.getElementById(id);

const DB_NAME='WellPetClinicDB', STORE='appointments';
function openDB(){
 return new Promise((resolve,reject)=>{
  const req=indexedDB.open(DB_NAME,1);
  req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE,{keyPath:'id'});};
  req.onsuccess=()=>resolve(req.result);
  req.onerror=()=>reject(req.error);
 });
}
async function loadAppointments(){
 try{
  const db=await openDB();
  appointments=await new Promise((resolve,reject)=>{
   const tx=db.transaction(STORE,'readonly'), req=tx.objectStore(STORE).getAll();
   req.onsuccess=()=>resolve(req.result||[]);
   req.onerror=()=>reject(req.error);
  });
 }catch(e){ appointments=[]; }
 render();
}
async function putAppointment(item){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite');
  tx.objectStore(STORE).put(item);
  tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
 });
}
async function deleteAppointment(id){
 const db=await openDB();
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORE,'readwrite');
  tx.objectStore(STORE).delete(id);
  tx.oncomplete=resolve; tx.onerror=()=>reject(tx.error);
 });
}
function checkedItems(){
 const items=[...document.querySelectorAll('.check input:checked')].map(x=>x.value);
 const other=$('otherText')?.value.trim();
 if(items.includes('อื่นๆ')&&other)return items.map(x=>x==='อื่นๆ'?'อื่นๆ: '+other:x);
 return items;
}
function fillForm(item){
 $('pet').value=item.pet||'';
 $('record').value=item.record||'';
 $('date').value=item.date||'';
 $('time').value=item.time||'';
 $('owner').value=item.owner||'';
 $('phone').value=item.phone||'';
 document.querySelectorAll('.check input').forEach(x=>x.checked=false);
 let otherText='';
 (item.items||[]).forEach(saved=>{
   const isOther=saved.startsWith('อื่นๆ: ');
   if(isOther){ document.querySelector('.check input[value="อื่นๆ"]').checked=true; otherText=saved.slice(6); }
   else {
     const cb=[...document.querySelectorAll('.check input')].find(x=>x.value===saved);
     if(cb)cb.checked=true;
   }
 });
 $('otherText').value=otherText;
}
let editingId=null;
async function saveAppointment(){
 const pet=$('pet').value.trim(), date=$('date').value, time=$('time').value;
 if(!pet||!date||!time){alert('กรุณากรอกชื่อสัตว์ วันที่ และเวลา');return}
 const item={id:editingId||Date.now(),pet,record:$('record').value.trim(),date,time,owner:$('owner').value.trim(),phone:$('phone').value.trim(),items:checkedItems()};
 try{
  await putAppointment(item);
  const idx=appointments.findIndex(x=>x.id===item.id);
  if(idx>=0)appointments[idx]=item; else appointments.push(item);
  editingId=null; clearForm(); render();
  alert(idx>=0?'แก้ไขนัดหมายเรียบร้อยแล้ว ✅':'บันทึกใบนัดเรียบร้อยแล้ว ✅');
 }catch(e){alert('บันทึกไม่สำเร็จ กรุณาลองใหม่');}
}
function clearForm(){
 ['pet','record','owner','phone'].forEach(id=>$(id).value='');
 $('date').value=new Date().toISOString().slice(0,10);
 $('time').value='09:00';
 document.querySelectorAll('.check input').forEach(x=>x.checked=false);
 if($('otherText'))$('otherText').value='';
 editingId=null;
}
function removeAppointment(id){deleteId=id;$('modal').classList.add('show')}
function closeModal(){deleteId=null;$('modal').classList.remove('show')}
async function confirmDelete(){
 try{
  await deleteAppointment(deleteId);
  appointments=appointments.filter(x=>x.id!==deleteId);
  closeModal();render();
 }catch(e){alert('ลบไม่สำเร็จ กรุณาลองใหม่');}
}
function showDetail(id){
 const x=appointments.find(a=>a.id===id); if(!x)return;
 detailId=id;
 $('detailContent').innerHTML=`
  <p><b>🐱 ชื่อสัตว์:</b> ${escapeHtml(x.pet)}</p>
  <p><b>📋 เลขประวัติ:</b> ${escapeHtml(x.record||'-')}</p>
  <p><b>📅 วันที่:</b> ${escapeHtml(x.date)}</p>
  <p><b>🕘 เวลา:</b> ${escapeHtml(x.time)}</p>
  <p><b>👤 เจ้าของ:</b> ${escapeHtml(x.owner||'-')}</p>
  <p><b>📞 โทร:</b> ${escapeHtml(x.phone||'-')}</p>
  <p><b>🩺 รายการ:</b> ${x.items?.length?x.items.map(i=>`<span class="badge">${escapeHtml(i)}</span> `).join(''):'-'}</p>`;
 $('detailModal').classList.add('show');
}
function closeDetail(){detailId=null;$('detailModal').classList.remove('show')}
function editCurrent(){
 const x=appointments.find(a=>a.id===detailId); if(!x)return;
 closeDetail(); fillForm(x); editingId=x.id;
 window.scrollTo({top:0,behavior:'smooth'});
}
function escapeHtml(s){
 return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function exportData(){
 const blob=new Blob([JSON.stringify(appointments,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='well_pet_appointments_backup.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function render(){
 const rows=$('rows');
 const q=($('searchBox')?.value||'').trim().toLowerCase();
 let list=[...appointments].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 if(q)list=list.filter(x=>[x.pet,x.record,x.owner,x.phone,(x.items||[]).join(' ')].join(' ').toLowerCase().includes(q));
 if(!list.length){
   rows.innerHTML='<tr><td colspan="6" style="text-align:center;padding:28px;color:#7d8794">'+(q?'ไม่พบรายการที่ค้นหา':'ยังไม่มีรายการนัดหมาย')+'</td></tr>';return;
 }
 rows.innerHTML=list.map(x=>`<tr>
 <td>${escapeHtml(x.date)}</td><td>${escapeHtml(x.time)}</td><td><b>${escapeHtml(x.pet)}</b><br><small>${escapeHtml(x.record||'')}</small></td>
 <td>${escapeHtml(x.owner||'-')}<br><small>${escapeHtml(x.phone||'')}</small></td>
 <td>${x.items?.length?x.items.map(i=>`<span class="badge">${escapeHtml(i)}</span> `).join(''):'-'}</td>
 <td style="white-space:nowrap">
   <button class="secondary" onclick="showDetail(${x.id})">ดู</button>
   <button class="secondary" onclick="removeAppointment(${x.id})">ลบ</button>
 </td></tr>`).join('');
}
$('searchBox')?.addEventListener('input',render);
clearForm();loadAppointments();
</script>
</body>
</html>
